services:
  engine:
    image: remote-dom-browser:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.browser
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./chromium-seccomp.json
    shm_size: 512m
    pids_limit: 512
    mem_limit: 2g
    tmpfs:
      - /tmp:size=512m,mode=1777
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ../dist:/app/dist:ro
      - ../node_modules:/app/node_modules:ro
      - ../tests/fixtures:/app/tests/fixtures:ro
      - container-profiles:/var/lib/remote-dom
    environment:
      ENGINE_MODE: demo
      ENGINE_HOST: 0.0.0.0
      CHROMIUM_PATH: /usr/bin/chromium
      PORT: 4173
      DEVICE_PROFILE_DIR: /var/lib/remote-dom
      BROWSER_STATE_DIR: /var/lib/remote-dom/browser-state
    command: [node, dist/server/main.js]
    networks: [demo]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4173/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
networks:
  demo:
    internal: true
volumes:
  container-profiles:
